services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./rag_pedagogical_workflow.json:/home/node/workflows/rag_pedagogical_workflow.json
    env_file:
      - ../.env
    environment:
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    entrypoint: ["/bin/sh", "-c"]
    command: "n8n start"

volumes:
  n8n_data:
