services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chroma_server
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    volumes:
      - ./data/chroma_db:/data
    restart: unless-stopped
    
  math-assistant:
    build: .
    container_name: math_assistant_app
    depends_on:
      - chromadb

    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - USE_VERTEXAI=${USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcp-key.json
    volumes:
      - ./data:/app/data
      - ./data-samples:/app/data-samples
      - ./src:/app/src
      - ./tests:/app/tests
      - ./run_ingest.py:/app/run_ingest.py
      - ./chat.py:/app/chat.py


    ports:
      - "8080:8080"
    # Enable interactive CLI chat via TTY
    stdin_open: true
    tty: true
    # Run FastAPI server by default
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --reload

